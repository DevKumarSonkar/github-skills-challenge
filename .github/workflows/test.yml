name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test-workflow:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and run tests    
        run: |
          pip install -r requirements.txt
            pytest --cov=src --cov-report=term-missing 

            